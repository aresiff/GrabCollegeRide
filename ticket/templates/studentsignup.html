<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup - Grab College Ride</title>
    {% load static %}

    <style>
        
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #e8f5e9; /* Light green for Grab theme */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url("{% static 'grab.png' %}") center center no-repeat;
            background-size: cover;
        }
        .signup-container {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        h2 {
            color: #43a047; /* Grab Green */
            margin-bottom: 30px;
        }
        .input-field {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn-signup {
            width: 100%;
            padding: 15px;
            background-color: #43a047; /* Grab Green */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-signup:hover {
            background-color: #388e3c;
        }
        .login-link {
            display: block;
            margin-top: 20px;
            color: #43a047;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        .login-link:hover {
            color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Student Signup</h2>
        <form action="" method="post">
            {% csrf_token %}
             
            <input type="text" name="studentid" class="input-field" placeholder="Enter Student ID" required>
            <input type="text" name="studentname" class="input-field" placeholder="Enter Full Name" required>
            <input type="tel" name="studentphoneno" class="input-field" placeholder="Enter Phone Number" required>
            <input type="text" name="studentaddress" class="input-field" placeholder="Enter Address" required>
            <input type="password" name="studentpass" class="input-field" placeholder="Create Password" required>
            <button type="submit" class="btn-signup">Sign Up</button>
        </form>
        <a href="{% url 'studentlogin' %}" class="login-link">Already have an account? Login here</a>
    </div>
</body>
</html>
