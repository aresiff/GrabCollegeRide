<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grab College Ride - Homepage</title>
    {% load static %}
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #e8f5e9; /* Light green for Grab theme */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url("{% static 'grab.png' %}") center center no-repeat;
            background-size: cover;     
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #43a047; /* Grab Green */
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            background-color: #43a047; /* Grab Green */
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #0056b3; 
        }
        .btn-student {
            background-color: #43a047;
        }
        .btn-driver {
            background-color: #f57c00; /* Orange for driver login */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Grab College Ride</h1>
        <p>For College Students and Drivers</p>

        <a href="{% url 'studentlogin' %}" class="btn btn-student">Student Login</a>
        <a href="{% url 'driverlogin' %}" class="btn btn-driver">Driver Login</a>
    </div>
</body>
</html>
