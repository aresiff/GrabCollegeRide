<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed</title>
    <style>
        body {
            background-color: #e8f5e9;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        .confirmation-container {
            background-color: white;
            padding: 40px;
            max-width:500px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
            margin: 100px auto; /* Center the content block and give it margin */
            border-radius: 8px;
        }

        h2 {
            color: #4CAF50;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        a {
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #45a049;
        }

        @media (max-width: 600px) {
            .confirmation-container {
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }

            p {
                font-size: 16px;
            }

            a {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="confirmation-container">
        <h2>Booking Confirmed</h2>
        <p>Your booking has been successfully recorded.</p>
        <a href="{% url 'studenthomepage' %}">Return to Homepage</a>
    </div>
</body>
</html>
