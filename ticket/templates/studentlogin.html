<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Grab College Ride</title>
    {% load static %}
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #e8f5e9; /* Light green for Grab theme */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url("{% static 'grab.png' %}") center center no-repeat;
            background-size: cover;
        }
        .login-container {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #43a047; /* Grab Green */
            margin-bottom: 30px;
        }
        .input-field {
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn-login {
            width: 90%;
            padding: 15px;
            background-color: #43a047; /* Grab Green */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-login:hover {
            background-color: #388e3c;
        }
        .signup-link {
            display: block;
            margin-top: 20px;
            color: #43a047;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        .signup-link:hover {
            color: #388e3c;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Student Login</h2>
        <form action="" method="post">
            {% csrf_token %}

            <input type="text" name="student_id" class="input-field" placeholder="Enter Student ID" required>
            <input type="password" name="password" class="input-field" placeholder="Enter Password" required>
            <button type="submit" class="btn-login">Login</button>
        </form>
        <a href="{% url 'studentsignup' %}" class="signup-link">Don't have an account? Sign up here</a>
    </div>
</body>
</html>
